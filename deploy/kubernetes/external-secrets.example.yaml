# Optional External Secrets Operator example.
# Configure a provider-specific ClusterSecretStore first, then replace the
# store name and remoteRef keys. This file is intentionally not part of the
# default deployment because those values are cluster/provider-specific.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mcproxy-runtime
  namespace: mcproxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: mcproxy-secret-store
    kind: ClusterSecretStore
  target:
    name: mcproxy-runtime
    creationPolicy: Owner
  data:
    - secretKey: admin-token
      remoteRef:
        key: mcproxy/prod/admin-token
    # Optional actor attribution: add the same mapping to mcproxy-panel below.
    # - secretKey: admin-actor-secret
    #   remoteRef:
    #     key: mcproxy/prod/admin-actor-secret
    - secretKey: postgres-dsn
      remoteRef:
        key: mcproxy/prod/postgres-dsn
    - secretKey: redis-password
      remoteRef:
        key: mcproxy/prod/redis-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: mcproxy-panel
  namespace: mcproxy
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: mcproxy-secret-store
    kind: ClusterSecretStore
  target:
    name: mcproxy-panel
    creationPolicy: Owner
  data:
    - secretKey: admin-token
      remoteRef:
        key: mcproxy/prod/admin-token
    # Optional actor attribution: use the exact same remote secret as above.
    # - secretKey: admin-actor-secret
    #   remoteRef:
    #     key: mcproxy/prod/admin-actor-secret
    - secretKey: username
      remoteRef:
        key: mcproxy/prod/panel-username
    - secretKey: password
      remoteRef:
        key: mcproxy/prod/panel-password
    - secretKey: session-secret
      remoteRef:
        key: mcproxy/prod/panel-session-secret
