apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcproxy-admin-panel
  labels:
    app.kubernetes.io/name: mcproxy-admin-panel
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcproxy-admin-panel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcproxy-admin-panel
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: admin-panel
          image: your-registry/mcproxy-admin-panel:replace-with-immutable-tag
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: panel-data
              mountPath: /data
          env:
            - name: MCPROXY_API_URL
              value: http://mcproxy-http:8080
            - name: MCPROXY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcproxy-panel
                  key: admin-token
            - name: MCPROXY_ADMIN_ACTOR_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcproxy-panel
                  key: admin-actor-secret
                  optional: true
            - name: ORIGIN
              value: https://admin.example.com
            # The ingress must overwrite X-Forwarded-Proto; do not expose this
            # workload directly while trusting client-supplied forwarding headers.
            - name: PROTOCOL_HEADER
              value: x-forwarded-proto
            - name: ADMIN_PANEL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mcproxy-panel
                  key: username
            - name: ADMIN_PANEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcproxy-panel
                  key: password
            - name: ADMIN_PANEL_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcproxy-panel
                  key: session-secret
            - name: ADMIN_PANEL_DB_PATH
              value: /data/admin-panel.db
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: panel-data
          persistentVolumeClaim:
            claimName: mcproxy-admin-panel-data
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mcproxy-admin-panel
  labels:
    app.kubernetes.io/name: mcproxy-admin-panel
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcproxy-admin-panel
---
apiVersion: v1
kind: Service
metadata:
  name: mcproxy-admin-panel
  labels:
    app.kubernetes.io/name: mcproxy-admin-panel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcproxy-admin-panel
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mcproxy-admin-panel-data
  labels:
    app.kubernetes.io/name: mcproxy-admin-panel
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
