apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcproxy-admin-panel
  labels:
    app.kubernetes.io/name: mcproxy-admin-panel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mcproxy-admin-panel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcproxy-admin-panel
    spec:
      automountServiceAccountToken: false
      containers:
        - name: admin-panel
          image: your-registry/mcproxy-admin-panel:replace-with-immutable-tag
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: MCPROXY_API_URL
              value: http://mcproxy-http:8080
            - name: MCPROXY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcproxy-panel
                  key: admin-token
            - name: ORIGIN
              value: https://admin.example.com
            - name: ADMIN_PANEL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mcproxy-panel
                  key: username
            - name: ADMIN_PANEL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcproxy-panel
                  key: password
            - name: ADMIN_PANEL_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcproxy-panel
                  key: session-secret
          readinessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /login
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mcproxy-admin-panel
  labels:
    app.kubernetes.io/name: mcproxy-admin-panel
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcproxy-admin-panel
---
apiVersion: v1
kind: Service
metadata:
  name: mcproxy-admin-panel
  labels:
    app.kubernetes.io/name: mcproxy-admin-panel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcproxy-admin-panel
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
