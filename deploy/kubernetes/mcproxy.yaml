apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcproxy
  labels:
    app.kubernetes.io/name: mcproxy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mcproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcproxy
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      containers:
        - name: mcproxy
          image: your-registry/mcproxy:replace-with-immutable-tag
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: minecraft
              containerPort: 25565
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          env:
            - name: MCPROXY_HTTP_ADDR
              value: 0.0.0.0:8080
            - name: MCPROXY_GATE_BIND
              value: 0.0.0.0:25565
            - name: MCPROXY_DB_DRIVER
              value: postgres
            - name: MCPROXY_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: mcproxy-runtime
                  key: postgres-dsn
            - name: MCPROXY_REDIS_ADDR
              value: redis.example.internal:6379
            - name: MCPROXY_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcproxy-runtime
                  key: redis-password
            - name: MCPROXY_REDIS_TLS
              value: "true"
            - name: MCPROXY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcproxy-runtime
                  key: admin-token
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mcproxy-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mcproxy-data
  labels:
    app.kubernetes.io/name: mcproxy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mcproxy-http
  labels:
    app.kubernetes.io/name: mcproxy
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcproxy
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: mcproxy-minecraft
  labels:
    app.kubernetes.io/name: mcproxy
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: mcproxy
  ports:
    - name: minecraft
      port: 25565
      targetPort: minecraft
      protocol: TCP
