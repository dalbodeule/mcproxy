services:
  mcproxy:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The image is already pinned to nonroot:nonroot. Mounted /data volumes
    # must therefore be provisioned writable by UID/GID 65532.
    env_file:
      - path: ../.env
        required: false
    environment:
      MCPROXY_HTTP_ADDR: 0.0.0.0:8080
      MCPROXY_GATE_BIND: 0.0.0.0:25565
      MCPROXY_DB_DRIVER: postgres
      MCPROXY_POSTGRES_DSN: postgres://mcproxy:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/mcproxy?sslmode=${POSTGRES_SSLMODE:-disable}
      MCPROXY_REDIS_ADDR: redis:6379
      MCPROXY_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      # Redis is part of the production protection boundary in this stack.
      # Set MCPROXY_REDIS_FAIL_CLOSED=false only when availability during a
      # Redis outage is the deliberate operational choice.
      MCPROXY_REDIS_FAIL_CLOSED: ${MCPROXY_REDIS_FAIL_CLOSED:-true}
      MCPROXY_SQLITE_PATH: /data/mcproxy.db
    ports:
      - "25565:25565"
    expose:
      - "8080"
    volumes:
      - mcproxy-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:18-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    restart: unless-stopped
    environment:
      POSTGRES_DB: mcproxy
      POSTGRES_USER: mcproxy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcproxy -d mcproxy"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  mcproxy-data:
  postgres-data:
  redis-data:
